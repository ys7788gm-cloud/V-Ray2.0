<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>V-RAY 2.0 | 접근 제한</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f6f2; color: #183126; }
    main { width: min(520px, calc(100% - 48px)); padding: 48px; border: 1px solid #dce4dd; border-radius: 24px; background: white; box-shadow: 0 20px 60px rgba(24,49,38,.08); }
    small { color: #668073; letter-spacing: .12em; }
    h1 { margin: 14px 0 12px; font-size: clamp(30px, 7vw, 48px); }
    p { margin: 0; line-height: 1.7; color: #4d6258; }
  </style>
</head>
<body>
  <main>
    <small>V-RAY 2.0</small>
    <h1>접근이 제한되었습니다.</h1>
    <p>관리자가 비밀번호 보호 방식으로 전환 중입니다. 현재 공개 웹 앱은 이용할 수 없습니다.</p>
  </main>
</body>
</html>
